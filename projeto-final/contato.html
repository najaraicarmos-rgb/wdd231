<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verde Lar - Contato</title>
    <meta name="description" content="Entre em contato com o Verde Lar para dúvidas e sugestões sobre jardinagem.">
    <meta name="author" content="Najara Carmo">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script type="module" src="scripts/main.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">Verde Lar</div>
        <button id="menu-btn" aria-label="Abrir menu">☰</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="content-section">
            <h1>Fale Conosco</h1>
            <form action="acao.html" method="get">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="mensagem">Dúvida ou Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="4" required></textarea>

                <button type="submit"
                    style="margin-top: 1rem; padding: 0.75rem 1.5rem; background-color: var(--terracota); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Enviar
                    Mensagem</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | Verde Lar - Najara Carmo</p>
        <p><a href="#" target="_blank">Assistir Vídeo de Demonstração</a></p>
    </footer>
</body>

</html>
