<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verde Lar - Mensagem Enviada</title>
    <meta name="description" content="Confirmação de envio de mensagem no Verde Lar.">
    <meta name="author" content="Najara Carmo">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header>
        <div class="logo">Verde Lar</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="content-section">
            <h1>Mensagem Recebida com Sucesso!</h1>
            <p>Obrigado pelo seu contato. Abaixo estão os dados que enviou:</p>
            <div id="resultado-formulario" style="margin-top: 1.5rem; line-height: 1.8;"></div>
            <p style="margin-top: 2rem;"><a href="index.html"
                    style="color: var(--terracota); font-weight: bold; text-decoration: underline;">Voltar à Página
                    Inicial</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | Verde Lar - Najara Carmo</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nome = params.get('nome');
        const email = params.get('email');
        const mensagem = params.get('mensagem');

        const container = document.querySelector('#resultado-formulario');
        if (container) {
            container.innerHTML = `
                <p><strong>Nome:</strong> ${nome ? nome : 'Não informado'}</p>
                <p><strong>E-mail:</strong> ${email ? email : 'Não informado'}</p>
                <p><strong>Mensagem:</strong> ${mensagem ? mensagem : 'Não informada'}</p>
            `;
        }
    </script>
</body>

</html>
