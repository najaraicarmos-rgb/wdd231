<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verde Lar - Mensagem Enviada</title>
    <link rel="stylesheet" href="estilos/base.css">
    <link rel="stylesheet" href="estilos/larger.css">
</head>

<body>
    <header>
        <div class="logo">Verde Lar</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="content-section">
            <h1>Mensagem Recebida com Sucesso!</h1>
            <p>Obrigado pelo seu contato. Abaixo estão os dados que enviou:</p>
            <div id="resultados-contato" style="margin: 1.5rem 0; line-height: 1.6;"></div>
            <p><a href="index.html">Voltar à Página Inicial</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | Verde Lar - Najara Carmo</p>
        <p><a href="https://www.youtube.com/watch?v=8M6qdX9jeyE" target="_blank">Assistir Vídeo de Demonstração</a></p>
    </footer>
    <script>
        const parametros = new URLSearchParams(window.location.search);
        const container = document.getElementById('resultados-contato');

        const nome = parametros.get('nome');
        const email = parametros.get('email');
        const mensagem = parametros.get('mensagem');

        if (nome || email || mensagem) {
            container.innerHTML = `
                <p><strong>Nome:</strong> ${nome || ''}</p>
                <p><strong>E-mail:</strong> ${email || ''}</p>
                <p><strong>Mensagem:</strong> ${mensagem || ''}</p>
            `;
        }
    </script>
</body>

</html>
