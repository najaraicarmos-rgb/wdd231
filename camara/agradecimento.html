<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de agradecimento da Câmara de Comércio.">
    <meta name="author" content="Najara Carmo">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Agradecimento - Câmara de Comércio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/normalize.css">
    <link rel="stylesheet" href="estilos/estilos.css">
    <link rel="stylesheet" href="estilos/telas-grandes.css">
</head>

<body>
    <header>
        <div class="header-box">
            <span class="logo">🏛️</span>
            <h1>Câmara de Comércio</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="diretorio.html">Diretório</a></li>
                <li><a href="associacao.html">Junte-se</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="join-main">
        <h2>Obrigado pela sua solicitação de associação!</h2>

        <div class="join-container" style="display: block;">
            <p>Recebemos as suas informações com sucesso. Abaixo estão os detalhes registrados:</p>

            <div id="resultados-formulario"
                style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; border: 1px solid #ddd; margin-top: 1rem; line-height: 1.8;">
            </div>

            <div style="margin-top: 2rem;">
                <a href="index.html" class="submit-btn" style="text-decoration: none; display: inline-block;">Voltar
                    para a Página Inicial</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Câmara de Comércio</p>
    </footer>

    <script>
        const parametros = new URLSearchParams(window.location.search);

        const nome = parametros.get('nome') || '';
        const sobrenome = parametros.get('sobrenome') || '';
        const cargo = parametros.get('cargo') || 'Não informado';
        const email = parametros.get('email') || 'Não informado';
        const telefone = parametros.get('telefone') || 'Não informado';
        const organizacao = parametros.get('organizacao') || 'Não informado';
        const nivel = parametros.get('nivel') || 'Não informado';
        const descricao = parametros.get('descricao') || 'Não informado';
        const timestamp = parametros.get('timestamp') || 'Não informado';

        const nomeCompleto = (nome || sobrenome) ? `${nome} ${sobrenome}`.trim() : 'Não informado';

        const container = document.getElementById('resultados-formulario');
        container.innerHTML = `
            <p><strong>Nome Completo:</strong> ${nomeCompleto}</p>
            <p><strong>Cargo na Organização:</strong> ${cargo}</p>
            <p><strong>E-mail:</strong> ${email}</p>
            <p><strong>Número de Celular:</strong> ${telefone}</p>
            <p><strong>Empresa/Organização:</strong> ${organizacao}</p>
            <p><strong>Nível de Associação:</strong> ${nivel.toUpperCase()}</p>
            <p><strong>Descrição:</strong> ${descricao}</p>
            <p><strong>Data e Hora do Registro:</strong> ${timestamp}</p>
        `;
    </script>
</body>

</html>
